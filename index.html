function startHeroSlideshow(){
  const hero=document.getElementById('iprintHero');
  const layers=[...hero.querySelectorAll('.hero-bg')];
  if(!hero||layers.length!==2||heroImages.length===0)return;
  let imageIndex=Math.floor(Math.random()*heroImages.length);
  let activeLayer=0;
  layers[0].style.backgroundImage=`url("${heroImages[imageIndex]}")`;
  const preloadNext=()=>{const image=new Image();image.src=heroImages[(imageIndex+1)%heroImages.length]};
  preloadNext();
  setInterval(()=>{
    const current=layers[activeLayer];
    const nextLayerIndex=activeLayer===0?1:0;
    const next=layers[nextLayerIndex];
    let nextIndex=imageIndex;
    while(heroImages.length>1&&nextIndex===imageIndex)nextIndex=Math.floor(Math.random()*heroImages.length);
    imageIndex=nextIndex;
    next.style.backgroundImage=`url("${heroImages[imageIndex]}")`;
    next.classList.remove('is-active','is-leaving');
    void next.offsetWidth;
    current.classList.add('is-leaving');
    next.classList.add('is-active');
    setTimeout(()=>current.classList.remove('is-active','is-leaving'),3400);
    activeLayer=nextLayerIndex;
    preloadNext();
  },30000);
}

let jobPage=1;
let jobQuery='';
const storedViewMode=localStorage.getItem('iprintViewMode');
let viewMode=storedViewMode==='list'?'list':'card';

function card(d,index){const pcTone=d.pcStatus==='Online'?'ok':'bad';const tsTone=d.tailscaleStatus==='Online'?'ok':'bad';const printerStatus=d.error>0?'Error':d.printing>0?'Printing':d.waiting>0?'Queue':'Idle';const printerTone=d.error>0?'bad':d.printing>0?'ok':d.waiting>0?'warn':'ok';const stateClass=d.error>0?'state-error':d.printing>0?'state-working':d.waiting>0?'state-warning':d.pcStatus==='Online'?'state-online':'';return `<article class="card theme-card ${stateClass}" data-name="${d.name.toLowerCase()} ${d.printer.toLowerCase()}"><div class="head"><div style="width:100%"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="name">${d.name}</div><div class="sub" style="white-space:nowrap">${d.address}</div></div><div class="sub">${d.os}</div></div></div><div class="status-grid"><div class="status-box"><small>PC 상태</small><span class="status-value ${pcTone}">${koreanPcStatus(d.pcStatus)}</span></div><div class="status-box"><small>Tailscale 상태</small><span class="status-value ${tsTone}">${koreanPcStatus(d.tailscaleStatus)}</span></div></div><div class="metrics">${metric('CPU',d.cpu,'%')}${metric('온도',d.temp,'℃')}${metric('메모리',d.ram,'%')}${metric('디스크',d.disk,'%')}</div><div class="printer"><div class="printer-top"><div><strong>${koreanPrinterName(d.printer)}</strong><div class="sub">인쇄 서비스: ${koreanSpooler(d.spooler)}</div><div class="sub">프린터 상태: <span class="${printerTone}">${koreanPrinterState(printerStatus)}</span></div><div class="sub">최근 상태: ${koreanLastAction(d.lastAction)}</div></div><button class="icon-btn" onclick="resetQueue(${index})" title="대기열 초기화" aria-label="대기열 초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.3 6.3L4 8.6"/><path d="M5.5 15A7 7 0 0 0 17.7 17.7L20 15.4"/></svg></button></div><div class="jobs"><div class="job"><b>${d.printing}</b><span>출력 중</span></div><div class="job"><b>${d.waiting}</b><span>대기</span></div><div class="job"><b>${d.error}</b><span>오류</span></div><div class="job"><b>${d.printing+d.waiting+d.error}</b><span>전체</span></div></div></div></article>`}
function metric(label,v,unit){const available=v!==null&&v!==undefined;const numeric=available?Number(v):0;const rounded=available?Math.round(numeric):null;const value=available?`${rounded}${unit}`:'N/A';const width=available?Math.min(Math.max(numeric,0),100):0;const bar=label==='CPU'?`<div class="bar"><div class="fill" style="width:${width}%"></div></div>`:'';return `<div class="metric"><small>${label}</small><strong>${value}</strong>${bar}</div>`}
function printerState(d){return d.error>0?'Error':d.printing>0?'Printing':d.waiting>0?'Queued':d.spooler==='Running'?'Idle':'Unknown'}
function koreanPcStatus(status){return status==='Online'?'온라인':status==='Offline'?'오프라인':status}
function koreanAddress(text){return text==='Agent Not Installed'?'에이전트 미설치':text==='Tailscale Unavailable'?'Tailscale 확인 불가':text}
function koreanPrinterName(text){return text==='Printer Not Connected'?'프린터 미연결':text==='No Printer Connected'?'프린터 미연결':text==='Unavailable'?'프린터 확인 불가':text}
function koreanSpooler(status){return status==='Running'?'작동 중':status==='Stopped'?'중지':status==='Unknown'?'확인 안 됨':status==='Not Available'?'사용 불가':status}
function koreanPrinterState(state){return state==='Printing'?'출력 중':state==='Queued'?'대기 중':state==='Error'?'오류':state==='Idle'?'대기 없음':state==='Unknown'?'확인 안 됨':state}
function koreanLastAction(text){if(!text)return'준비됨';return text.replace(/^Live · /,'실시간 · ').replace('Agent Unreachable','에이전트 연결 안 됨').replace('Waiting for live status','실시간 상태 확인 중').replace('Queue Reset Completed','대기열 초기화 완료').replace(/^Ready$/,'준비됨')}
function listCard(d,index){const state=printerState(d);const tone=state==='Error'?'bad':state==='Queued'?'warn':state==='Unknown'?'bad':'ok';const pcTone=d.pcStatus==='Online'?'ok':'bad';const stateClass=d.error>0?'state-error':d.printing>0?'state-working':d.waiting>0?'state-warning':d.pcStatus==='Online'?'state-online':'';const workingMark=d.printing>0?'<span class="working-dot" aria-hidden="true"></span>':'';const connectionMark=d.pcStatus==='Online'?'<span class="connection-dot" aria-hidden="true"></span>':'';return `<article class="printer-list-card card ${stateClass}" data-name="${d.name.toLowerCase()} ${d.printer.toLowerCase()}"><div class="printer-list-main row1"><div class="printer-list-title">${d.name}</div><div class="printer-list-meta"><span class="list-state ${pcTone}">${connectionMark}${koreanPcStatus(d.pcStatus)}</span><span>${koreanAddress(d.address)}</span></div></div><div class="printer-list-detail detail1"><div class="printer-list-name">${workingMark}${koreanPrinterName(d.printer)}</div><div class="printer-list-meta"><span>인쇄 서비스 ${koreanSpooler(d.spooler)}</span><span class="list-divider">│</span><span class="list-state ${tone}">${koreanPrinterState(state)}</span></div></div><div class="printer-list-meta row2"><span>출력 중 <b>${d.printing}</b></span><span>대기 <b>${d.waiting}</b></span><span>오류 <b>${d.error}</b></span><span class="list-divider">│</span><span>${koreanLastAction(d.lastAction)}</span></div><button class="icon-btn" onclick="resetQueue(${index})" title="대기열 초기화" aria-label="대기열 초기화">${d.pcStatus==='Online'?'<span class="connection-dot" aria-hidden="true"></span>':''}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.3 6.3L4 8.6"/><path d="M5.5 15A7 7 0 0 0 17.7 17.7L20 15.4"/></svg></button></article>`}
function updateViewButtons(){
  const listButton=document.getElementById('listViewBtn');
  const cardButton=document.getElementById('cardViewBtn');
  const list=document.getElementById('deviceList');
  listButton?.classList.toggle('active',viewMode==='list');
  cardButton?.classList.toggle('active',viewMode==='card');
  list.classList.remove('list-view','card-view','theme-view');
  list.classList.add(`${viewMode}-view`);
  list.dataset.viewMode=viewMode;
}
function applyDeviceSearch(){const query=search.value.trim().toLowerCase();document.querySelectorAll('#deviceList .card').forEach(item=>item.style.display=item.dataset.name.includes(query)?'':'none')}
function render(){
  const list=document.getElementById('deviceList');
  const renderer=viewMode==='list'?listCard:card;
  list.innerHTML=devices.map((d,index)=>renderer(d,index)).join('');
  updateViewButtons();
  applyDeviceSearch();
}
function setViewMode(mode){
  viewMode=mode==='card'?'card':'list';
  localStorage.setItem('iprintViewMode',viewMode);
  render();
}
async function load5800XStatus(){
  try{
    const response=await fetch('/api/devices/5800x/status',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    const d=devices[0];
    d.name='5800X';
    d.os=data.cpu_name?`Windows 11 Home · ${data.cpu_name.replace(/\s+Processor$/i,'')}`:'Windows 11 Home · AMD Ryzen 7 5800X 8-Core';
    d.address=data.tailscale_ip?`Tailscale ${data.tailscale_ip}`:'Tailscale Unavailable';
    d.pcStatus=data.pc_status||'Offline';
    d.tailscaleStatus=data.tailscale_status||'Offline';
    d.cpu=Number(data.cpu_percent||0);
    d.temp=data.temperature_c;
    d.ram=Number(data.memory_percent||0);
    d.disk=Number(data.disk_percent||0);
    d.printer=data.printer_name||'No Printer Connected';
    d.spooler=data.spooler||'Unknown';
    d.printing=Number(data.printing||0);
    d.waiting=Number(data.queued||0);
    d.error=Number(data.error||0);
    d.lastAction=data.agent_reachable?`Live · ${data.updated_at||'Now'}`:'Agent Unreachable';
    render();
  }catch(error){
    const d=devices[0];
    d.pcStatus='Offline';d.tailscaleStatus='Offline';d.cpu=0;d.temp=null;d.ram=0;d.disk=0;d.printer='Unavailable';d.spooler='Unknown';d.printing=0;d.waiting=0;d.error=0;d.lastAction='Agent Unreachable';render();
  }
}

  }
}
function statusTone(status){if(status==='Error')return 'bad';if(status==='Queued')return 'warn';return 'ok'}
async function loadPrinterJobs(page=1){
  jobRows.innerHTML='<tr><td colspan="8" class="empty">Loading...</td></tr>';
  try{
    const params=new URLSearchParams({page:String(page),search:jobQuery});
    const response=await fetch('/api/printer-jobs?'+params.toString());
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    jobPage=data.page;
    jobRows.innerHTML=data.items.length?data.items.map(item=>`<tr><td>${item.id}</td><td>${item.created_at}</td><td>${item.computer_name}</td><td>${item.printer_name}</td><td>${item.user_name}</td><td>${item.document_name}</td><td class="${statusTone(item.status)}">${item.status}</td><td>${item.wait_time}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No records found.</td></tr>';
    jobMeta.textContent=`${data.total} records · Page ${data.page} of ${data.total_pages}`;
    renderPagination(data.page,data.total_pages);
  }catch(error){
    jobRows.innerHTML='<tr><td colspan="8" class="empty">Failed to load printer history.</td></tr>';
    jobMeta.textContent=error.message;
  }
}
function renderPagination(current,total){
  const buttons=[];
  buttons.push(`<button class="page-btn" ${current<=1?'disabled':''} onclick="loadPrinterJobs(${current-1})">Prev</button>`);
  const start=Math.max(1,current-2),end=Math.min(total,current+2);
  if(start>1)buttons.push(`<button class="page-btn" onclick="loadPrinterJobs(1)">1</button>`);
  if(start>2)buttons.push('<span>...</span>');
  for(let page=start;page<=end;page++)buttons.push(`<button class="page-btn ${page===current?'active':''}" onclick="loadPrinterJobs(${page})">${page}</button>`);
  if(end<total-1)buttons.push('<span>...</span>');
  if(end<total)buttons.push(`<button class="page-btn" onclick="loadPrinterJobs(${total})">${total}</button>`);
  buttons.push(`<button class="page-btn" ${current>=total?'disabled':''} onclick="loadPrinterJobs(${current+1})">Next</button>`);
  jobPagination.innerHTML=buttons.join('');
}
function resetQueue(index){const d=devices[index];if(d.pcStatus!=='Online'){alert('This PC is Offline.');return}d.printing=0;d.waiting=0;d.error=0;d.spooler=d.spooler==='Not Available'?'Not Available':'Running';d.lastAction='Queue Reset Completed';render();document.querySelector('.live').innerHTML='<span class="dot"></span>'+d.name+' queue reset completed';setTimeout(()=>document.querySelector('.live').innerHTML='<span class="dot"></span>Test monitoring active',2200)}
function refreshMock(){document.querySelector('.live').innerHTML='<span class="dot"></span>Live data refreshed';load5800XStatus();loadMacMiniStatus();loadPrinterJobs(jobPage);setTimeout(()=>document.querySelector('.live').innerHTML='<span class="dot"></span>Live monitoring active',1800)}
search.addEventListener('input',applyDeviceSearch);
jobSearchForm.addEventListener('submit',event=>{event.preventDefault();jobQuery=jobSearch.value.trim();loadPrinterJobs(1)});
jobSearchClear.addEventListener('click',()=>{jobSearch.value='';jobQuery='';loadPrinterJobs(1)});
startHeroSlideshow();
render();
load5800XStatus();
loadMacMiniStatus();
loadPrinterJobs(1);
setInterval(load5800XStatus,5000);
setInterval(loadMacMiniStatus,5000);
setInterval(()=>loadPrinterJobs(jobPage),5000);
