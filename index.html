  <style>

    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0,#17375a 0,transparent 35%),var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}

    .devices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:12px}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:850}.sub{color:var(--muted);font-size:12px;margin-top:2px}.badge{height:25px;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:850}.ok{color:var(--ok);background:#33d69f18}.warn{color:var(--warn);background:#ffbf4b18}.bad{color:var(--bad);background:#ff657718}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.status-box{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:7px 9px;border:1px solid #1d3550;border-radius:10px;background:#0a1726}.status-box small{color:var(--muted);font-size:9px;letter-spacing:.05em}.status-value{font-size:11px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.metric{background:#101f32;border:1px solid #1d3550;border-radius:10px;padding:7px 8px;display:grid;grid-template-columns:auto auto minmax(24px,1fr);align-items:center;gap:7px}.metric small{color:var(--muted);font-size:10px;white-space:nowrap}.metric strong{display:inline;font-size:14px;line-height:1;white-space:nowrap}.bar{height:5px;background:#07111f;border-radius:9px;margin-top:0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4f9cff,#53e1c1);border-radius:9px}.printer{margin-top:10px;padding:10px;border-radius:12px;background:#091523;border:1px solid #1b314a}.card,.card *{min-width:0}.printer-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.printer-top>div{min-width:0;flex:1}.printer-top strong,.printer-top .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon-btn{width:34px;height:34px;min-width:34px;padding:0;border:1px solid #315171;background:#173756;color:#dcecff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 34px}.icon-btn:hover{background:#214b73}.icon-btn svg{width:17px;height:17px;display:block}.jobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.job{padding:7px 6px;border-radius:8px;background:#102238;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.job b{display:inline;font-size:15px;line-height:1}.job span{font-size:9px;color:var(--muted)}
    .tablebox{margin-top:18px;padding:20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}th,td{text-align:left;padding:14px;border-bottom:1px solid #1d324b;font-size:13px}th{color:#89a6c7}.empty{text-align:center;color:#8297af;padding:30px}.board-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:16px 0;flex-wrap:wrap}.board-search{display:flex;gap:8px;flex:1;min-width:280px}.board-search input{flex:1;background:#0d1c2e;color:white;border:1px solid #29415f;border-radius:12px;padding:11px 13px}.board-meta{color:var(--muted);font-size:13px}.pagination{display:flex;justify-content:center;gap:7px;align-items:center;margin-top:18px;flex-wrap:wrap}.page-btn{min-width:38px;border:1px solid #315171;background:#10243b;color:#dcecff;border-radius:10px;padding:9px 11px;cursor:pointer}.page-btn.active{background:#397fda;border-color:#62a8ff;color:white}.page-btn:disabled{opacity:.35;cursor:not-allowed}
    @media(max-width:1250px){.devices{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.devices{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,1fr)}.live{position:static;margin-top:20px}.hero h1{font-size:27px}}@media(max-width:680px){.devices{grid-template-columns:1fr}}

<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">I-PRINT REMOTE CONTROL CENTER</div>
    <h1>I-PRINT 숭실대학교</h1>
    <p>5800X와 Mac mini만 실데이터, 나머지는 테스트 슬롯</p>
    <div class="live"><span class="dot"></span>테스트 모니터링 작동 중</div>
  </section>

  <section class="stats">
    <div class="stat"><span>등록 컴퓨터</span><b id="totalPc">12</b></div>
    <div class="stat"><span>실제 연결 확인</span><b>2</b></div>
    <div class="stat"><span>프린터 슬롯</span><b>12</b></div>
    <div class="stat"><span>대기 작업</span><b>3</b></div>
    <div class="stat"><span>오류·주의</span><b>1</b></div>
  </section>

  <div class="toolbar">
    <input id="search" placeholder="컴퓨터 또는 프린터 검색">
    <select><option>전체 상태</option><option>정상</option><option>주의</option><option>오류</option></select>
    <button class="btn" onclick="refreshMock()">전체 새로고침</button>
    <button class="btn" onclick="alert('테스트 화면에서는 명령을 실행하지 않습니다.')">선택 대기열 삭제</button>
  </div>

  <section class="devices" id="deviceList"></section>

  <section class="tablebox">
    <div class="head"><div><div class="name">Recent Printer Jobs</div><div class="sub">SQLite history board · 10 records per page</div></div></div>
    <div class="board-tools">
      <form class="board-search" id="jobSearchForm">
        <input id="jobSearch" placeholder="Search computer, printer, user, document, or status">
        <button class="btn" type="submit">Search</button>
        <button class="btn" type="button" id="jobSearchClear">Clear</button>
      </form>
      <div class="board-meta" id="jobMeta">Loading records...</div>
    </div>
    <table><thead><tr><th>ID</th><th>TIME</th><th>COMPUTER</th><th>PRINTER</th><th>USER</th><th>DOCUMENT</th><th>STATUS</th><th>WAIT</th></tr></thead>
    <tbody id="jobRows"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody></table>
    <div class="pagination" id="jobPagination"></div>
  </section>
</div>

 {name:'숭덕경상관',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0},

 {name:'연구관',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0},
 {name:'창신관',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0},

 {name:'전산관',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0},
 {name:'정보과학관',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0},
 {name:'웨스트민스터홀',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0},
 {name:'창의관',os:'Windows · Test Slot',address:'Agent Not Installed',pcStatus:'Offline',tailscaleStatus:'Offline',cpu:0,temp:null,ram:0,disk:0,printer:'Printer Not Connected',spooler:'Unknown',printing:0,waiting:0,error:0}
];
let jobPage=1;
let jobQuery='';
function card(d,index){const pcTone=d.pcStatus==='Online'?'ok':'bad';const tsTone=d.tailscaleStatus==='Online'?'ok':'bad';const printerStatus=d.error>0?'Error':d.printing>0?'Printing':d.waiting>0?'Queue':'Idle';const printerTone=d.error>0?'bad':d.printing>0?'ok':d.waiting>0?'warn':'ok';return `<article class="card" data-name="${d.name.toLowerCase()} ${d.printer.toLowerCase()}"><div class="head"><div style="width:100%"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="name">${d.name}</div><div class="sub" style="white-space:nowrap">${d.address}</div></div><div class="sub">${d.os}</div></div></div><div class="status-grid"><div class="status-box"><small>PC STATUS</small><span class="status-value ${pcTone}">${d.pcStatus}</span></div><div class="status-box"><small>TAILSCALE</small><span class="status-value ${tsTone}">${d.tailscaleStatus}</span></div></div><div class="metrics">${metric('CPU',d.cpu,'%')}${metric('TEMP',d.temp,'℃')}${metric('MEM',d.ram,'%')}${metric('DISK',d.disk,'%')}</div><div class="printer"><div class="printer-top"><div><strong>${d.printer}</strong><div class="sub">SPOOLER: ${d.spooler}</div><div class="sub">PRINTER STATUS: <span class="${printerTone}">${printerStatus}</span></div><div class="sub">LAST ACTION: ${d.lastAction||'Ready'}</div></div><button class="icon-btn" onclick="resetQueue(${index})" title="Reset Print Queue" aria-label="Reset Print Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.3 6.3L4 8.6"/><path d="M5.5 15A7 7 0 0 0 17.7 17.7L20 15.4"/></svg></button></div><div class="jobs"><div class="job"><b>${d.printing}</b><span>PRINTING</span></div><div class="job"><b>${d.waiting}</b><span>QUEUED</span></div><div class="job"><b>${d.error}</b><span>ERROR</span></div><div class="job"><b>${d.printing+d.waiting+d.error}</b><span>TOTAL</span></div></div></div></article>`}
function metric(label,v,unit){const available=v!==null&&v!==undefined;const numeric=available?Number(v):0;const rounded=available?Math.round(numeric):null;const value=available?`${rounded}${unit}`:'N/A';const width=available?Math.min(Math.max(numeric,0),100):0;const bar=label==='CPU'?`<div class="bar"><div class="fill" style="width:${width}%"></div></div>`:'';return `<div class="metric"><small>${label}</small><strong>${value}</strong>${bar}</div>`}
function render(){deviceList.innerHTML=devices.map((d,index)=>card(d,index)).join('')}
async function load5800XStatus(){
  try{
    const response=await fetch('/api/devices/5800x/status',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    const d=devices[0];
    d.name='5800X';
    d.os=data.cpu_name?`Windows 11 Home · ${data.cpu_name.replace(/\s+Processor$/i,'')}`:'Windows 11 Home · AMD Ryzen 7 5800X 8-Core';
    d.address=data.tailscale_ip?`Tailscale ${data.tailscale_ip}`:'Tailscale Unavailable';
    d.pcStatus=data.pc_status||'Offline';
    d.tailscaleStatus=data.tailscale_status||'Offline';
    d.cpu=Number(data.cpu_percent||0);
    d.temp=data.temperature_c;
    d.ram=Number(data.memory_percent||0);
    d.disk=Number(data.disk_percent||0);
    d.printer=data.printer_name||'No Printer Connected';
    d.spooler=data.spooler||'Unknown';
    d.printing=Number(data.printing||0);
    d.waiting=Number(data.queued||0);
    d.error=Number(data.error||0);
    d.lastAction=data.agent_reachable?`Live · ${data.updated_at||'Now'}`:'Agent Unreachable';
    render();
  }catch(error){
    const d=devices[0];
    d.pcStatus='Offline';d.tailscaleStatus='Offline';d.cpu=0;d.temp=null;d.ram=0;d.disk=0;d.printer='Unavailable';d.spooler='Unknown';d.printing=0;d.waiting=0;d.error=0;d.lastAction='Agent Unreachable';render();
  }
}

    d.pcStatus='Offline';d.tailscaleStatus='Offline';d.cpu=0;d.temp=null;d.ram=0;d.disk=0;d.printer='Unavailable';d.spooler='Unknown';d.printing=0;d.waiting=0;d.error=0;d.lastAction='Agent Unreachable';render();
  }
}
function statusTone(status){if(status==='Error')return 'bad';if(status==='Queued')return 'warn';return 'ok'}
async function loadPrinterJobs(page=1){
  jobRows.innerHTML='<tr><td colspan="8" class="empty">Loading...</td></tr>';
  try{
    const params=new URLSearchParams({page:String(page),search:jobQuery});
    const response=await fetch('/api/printer-jobs?'+params.toString());
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    jobPage=data.page;
    jobRows.innerHTML=data.items.length?data.items.map(item=>`<tr><td>${item.id}</td><td>${item.created_at}</td><td>${item.computer_name}</td><td>${item.printer_name}</td><td>${item.user_name}</td><td>${item.document_name}</td><td class="${statusTone(item.status)}">${item.status}</td><td>${item.wait_time}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No records found.</td></tr>';
    jobMeta.textContent=`${data.total} records · Page ${data.page} of ${data.total_pages}`;
    renderPagination(data.page,data.total_pages);
  }catch(error){
    jobRows.innerHTML='<tr><td colspan="8" class="empty">Failed to load printer history.</td></tr>';
    jobMeta.textContent=error.message;
  }
}
function renderPagination(current,total){
  const buttons=[];
  buttons.push(`<button class="page-btn" ${current<=1?'disabled':''} onclick="loadPrinterJobs(${current-1})">Prev</button>`);
  const start=Math.max(1,current-2),end=Math.min(total,current+2);
  if(start>1)buttons.push(`<button class="page-btn" onclick="loadPrinterJobs(1)">1</button>`);
  if(start>2)buttons.push('<span>...</span>');
  for(let page=start;page<=end;page++)buttons.push(`<button class="page-btn ${page===current?'active':''}" onclick="loadPrinterJobs(${page})">${page}</button>`);
  if(end<total-1)buttons.push('<span>...</span>');
  if(end<total)buttons.push(`<button class="page-btn" onclick="loadPrinterJobs(${total})">${total}</button>`);
  buttons.push(`<button class="page-btn" ${current>=total?'disabled':''} onclick="loadPrinterJobs(${current+1})">Next</button>`);
  jobPagination.innerHTML=buttons.join('');
}
function resetQueue(index){const d=devices[index];if(d.pcStatus!=='Online'){alert('This PC is Offline.');return}d.printing=0;d.waiting=0;d.error=0;d.spooler=d.spooler==='Not Available'?'Not Available':'Running';d.lastAction='Queue Reset Completed';render();document.querySelector('.live').innerHTML='<span class="dot"></span>'+d.name+' queue reset completed';setTimeout(()=>document.querySelector('.live').innerHTML='<span class="dot"></span>Test monitoring active',2200)}
function refreshMock(){document.querySelector('.live').innerHTML='<span class="dot"></span>Live data refreshed';load5800XStatus();loadMacMiniStatus();loadPrinterJobs(jobPage);setTimeout(()=>document.querySelector('.live').innerHTML='<span class="dot"></span>Live monitoring active',1800)}
search.addEventListener('input',e=>document.querySelectorAll('.card').forEach(c=>c.style.display=c.dataset.name.includes(e.target.value.toLowerCase())?'':'none'));
jobSearchForm.addEventListener('submit',event=>{event.preventDefault();jobQuery=jobSearch.value.trim();loadPrinterJobs(1)});
jobSearchClear.addEventListener('click',()=>{jobSearch.value='';jobQuery='';loadPrinterJobs(1)});
render();
load5800XStatus();
loadMacMiniStatus();
loadPrinterJobs(1);
setInterval(load5800XStatus,5000);
setInterval(loadMacMiniStatus,5000);
setInterval(()=>loadPrinterJobs(jobPage),5000);
</script>
